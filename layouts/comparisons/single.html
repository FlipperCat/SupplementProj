{{ define "main" }}

<div class="container">
    <article class="supplement-page">

        <!-- Main Content -->
        <div class="supplement-content">

            <!-- Header -->
            <header class="supplement-header">
                <span class="supplement-category">Comparison</span>
                <h1 class="supplement-title">{{ .Title }}</h1>
                {{ with .Params.tagline }}
                <p class="supplement-subtitle">{{ . }}</p>
                {{ end }}
            </header>

            <!-- Main Article Content -->
            <div class="article-content">
                {{ .Content }}
            </div>

            <!-- Tags -->
            {{ with .Params.tags }}
            <div class="tag-list" style="margin-top: var(--spacing-2xl);">
                {{ range . }}
                <a href="/tags/{{ . | urlize }}/" class="tag">{{ . }}</a>
                {{ end }}
            </div>
            {{ end }}

        </div>

        <!-- Sidebar -->
        <aside class="supplement-sidebar">

            <!-- Shop (disabled — no affiliate link yet) -->
            {{/*
            <div class="affiliate-cta">
                <h4>Shop Supplements</h4>
                <p>Get quality supplements from trusted retailers</p>
                <a href="https://www.iherb.com/" class="btn btn-block" target="_blank" rel="noopener sponsored" data-affiliate="iherb">
                    Shop on iHerb
                </a>
            </div>
            */}}

            <!-- Table of Contents -->
            <div class="sidebar-box">
                <h4>On This Page</h4>
                <ul class="toc-list">
                    <!-- Generated by JS -->
                </ul>
            </div>

        </aside>

    </article>
</div>

{{ end }}
