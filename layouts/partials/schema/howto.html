{{ if .Params.howto_steps }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "HowTo",
  "name": {{ .Title | jsonify }},
  "description": {{ with .Description }}{{ . | jsonify }}{{ else }}{{ .Params.tagline | jsonify }}{{ end }},
  "step": [
    {{ range $i, $step := .Params.howto_steps }}{{ if $i }},{{ end }}
    {
      "@type": "HowToStep",
      "position": {{ add $i 1 }},
      "name": {{ $step.name | jsonify }},
      "text": {{ $step.text | jsonify }}
    }
    {{ end }}
  ]
}
</script>
{{ end }}
