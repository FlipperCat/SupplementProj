<header class="site-header">
    <div class="container">
        <div class="header-inner">
            <a href="/" class="logo">
                <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
                    <path d="M16 8v16M10 16h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="logo-text">Supplement Guide</span>
            </a>

            <nav class="main-nav">
                {{ range .Site.Menus.main }}
                <a href="{{ .URL }}" class="nav-link {{ if $.IsMenuCurrent "main" . }}active{{ end }}">
                    {{ .Name }}
                </a>
                {{ end }}
            </nav>

            <div class="header-actions">
                <button class="search-toggle" aria-label="Search">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                </button>
                <button class="mobile-menu-toggle" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Menu -->
    <div class="mobile-nav">
        <div class="container">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL }}" class="mobile-nav-link">{{ .Name }}</a>
            {{ end }}
        </div>
    </div>

    <!-- Search Overlay -->
    <div class="search-overlay">
        <div class="search-container">
            <input type="search" class="search-input" placeholder="Search supplements, guides, and more...">
            <button class="search-close" aria-label="Close search">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </div>
</header>
