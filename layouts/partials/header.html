<header class="site-header">
    <div class="container">
        <div class="header-inner">
            <a href="/" class="logo">
                <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
                    <path d="M16 8v16M10 16h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="logo-text">VitaWise</span>
            </a>

            <nav class="main-nav">
                {{ range .Site.Menus.main }}
                    {{ if .HasChildren }}
                    <div class="nav-dropdown">
                        <a href="{{ .URL }}" class="nav-link">
                            {{ .Name }}
                            <svg class="dropdown-arrow" width="10" height="6" viewBox="0 0 10 6">
                                <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none"/>
                            </svg>
                        </a>
                        <div class="dropdown-menu">
                            {{ range .Children }}
                            <a href="{{ .URL }}" class="dropdown-item">{{ .Name }}</a>
                            {{ end }}
                        </div>
                    </div>
                    {{ else }}
                    <a href="{{ .URL }}" class="nav-link {{ if $.IsMenuCurrent "main" . }}active{{ end }}">
                        {{ .Name }}
                    </a>
                    {{ end }}
                {{ end }}
            </nav>

            <div class="header-actions">
                <button class="theme-toggle" aria-label="Toggle dark mode" id="theme-toggle">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </button>
                <button class="search-toggle" aria-label="Search">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                </button>
                <button class="mobile-menu-toggle" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Menu -->
    <div class="mobile-nav">
        <div class="container">
            {{ range .Site.Menus.main }}
                {{ if .HasChildren }}
                <div class="mobile-dropdown">
                    <button class="mobile-dropdown-toggle">
                        {{ .Name }}
                        <svg width="12" height="7" viewBox="0 0 12 7" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 1l5 5 5-5"/>
                        </svg>
                    </button>
                    <div class="mobile-dropdown-items">
                        {{ range .Children }}
                        <a href="{{ .URL }}">{{ .Name }}</a>
                        {{ end }}
                    </div>
                </div>
                {{ else }}
                <a href="{{ .URL }}" class="mobile-nav-link">{{ .Name }}</a>
                {{ end }}
            {{ end }}
        </div>
    </div>

    <!-- Search Overlay -->
    <div class="search-overlay">
        <div class="search-container">
            <input type="search" class="search-input" id="pagefind-search" placeholder="Search supplements, guides, and more..." aria-label="Search site">
            <button class="search-close" aria-label="Close search">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="search-results" id="pagefind-results"></div>
    </div>
</header>
