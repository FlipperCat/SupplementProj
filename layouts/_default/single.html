{{ define "main" }}

<div class="container">
    <article class="supplement-page">

        <!-- Main Content -->
        <div class="supplement-content">

            <!-- Header -->
            <header class="supplement-header">
                {{ with .Section }}
                <span class="supplement-category">{{ . | humanize }}</span>
                {{ end }}
                <h1 class="supplement-title">{{ .Title }}</h1>
                {{ with .Params.tagline }}
                <p class="supplement-subtitle">{{ . }}</p>
                {{ end }}
            </header>

            <!-- Main Article Content -->
            <div class="article-content">
                {{ .Content }}
            </div>

            <!-- Tags -->
            {{ with .Params.tags }}
            <div class="tag-list" style="margin-top: var(--spacing-2xl);">
                {{ range . }}
                <a href="/tags/{{ . | urlize }}/" class="tag">{{ . }}</a>
                {{ end }}
            </div>
            {{ end }}

        </div>

        <!-- Sidebar -->
        <aside class="supplement-sidebar">

            <!-- Table of Contents -->
            <div class="sidebar-box">
                <h4>On This Page</h4>
                <ul class="toc-list">
                    <!-- Generated by JS -->
                </ul>
            </div>

        </aside>

    </article>
</div>

{{ end }}
