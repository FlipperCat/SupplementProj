{{ define "main" }}

<div class="container">
    <header class="reference-header">
        <h1>{{ .Title }}</h1>
        <p class="reference-subtitle">{{ .Description }}</p>
        <div class="reference-actions">
            <a href="/analyzer/" class="btn btn-primary">Analyze Your Stack</a>
            <a href="/supplements/" class="btn btn-secondary">Browse All Supplements</a>
        </div>
    </header>

    <div class="reference-content article-content">
        {{ .Content }}
    </div>
</div>

<style>
.reference-header {
    text-align: center;
    margin-bottom: var(--spacing-2xl);
    padding-bottom: var(--spacing-xl);
    border-bottom: 1px solid var(--color-cream-dark);
}

.reference-subtitle {
    color: var(--color-text-light);
    font-size: 1.125rem;
    max-width: 600px;
    margin: 0 auto var(--spacing-xl);
}

.reference-actions {
    display: flex;
    gap: var(--spacing-md);
    justify-content: center;
    flex-wrap: wrap;
}

.reference-content {
    max-width: 100%;
}

.reference-content table {
    width: 100%;
    margin: var(--spacing-lg) 0 var(--spacing-2xl);
}

.reference-content th {
    position: sticky;
    top: 72px;
    background: var(--color-cream);
    z-index: 10;
}

.reference-content h3 {
    margin-top: var(--spacing-2xl);
    padding-top: var(--spacing-lg);
    border-top: 2px solid var(--color-primary);
}

.reference-content td a {
    font-weight: 500;
}
</style>

{{ end }}
