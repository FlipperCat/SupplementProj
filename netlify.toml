[build]
  publish = "public"
  command = "hugo --gc --minify && npx pagefind --site public"

[build.environment]
  HUGO_VERSION = "0.121.1"
  HUGO_ENV = "production"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/supplements/vitamin-d/*"
  to = "/supplements/vitamin-d3/"
  status = 301

[[redirects]]
  from = "/supplements/fish-oil/*"
  to = "/supplements/omega-3/"
  status = 301

[[redirects]]
  from = "/goals/supplements-for-joint-mobility/"
  to = "/goals/supplements-for-joint-health/"
  status = 301

[[redirects]]
  from = "/goals/supplements-for-stress/"
  to = "/goals/supplements-for-stress-cortisol/"
  status = 301

[[redirects]]
  from = "/guides/quality-supplements/"
  to = "/guides/quality-supplements-buying-guide/"
  status = 301

[[redirects]]
  from = "/supplements/biotin/"
  to = "/supplements/vitamin-b7-biotin/"
  status = 301

[[redirects]]
  from = "/supplements/lutein/"
  to = "/supplements/lutein-zeaxanthin/"
  status = 301

[[redirects]]
  from = "/tools/"
  to = "/analyzer/"
  status = 301

[[redirects]]
  from = "/best-supplement-stacks/"
  to = "/stacks/"
  status = 301

[[redirects]]
  from = "/lead-magnet/"
  to = "/"
  status = 301
