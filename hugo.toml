[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[permalinks]
  supplements = "/supplements/:slug/"
  stacks = "/stacks/:slug/"
  medications = "/medications/:slug/"
  goals = "/goals/:slug/"
  comparisons = "/comparisons/:slug/"
  guides = "/guides/:slug/"
  timelines = "/timelines/:slug/"
  interactions = "/interactions/:slug/"
  blog = "/blog/:slug/"
  browse = "/browse/:slug/"
  peptides = "/peptides/:slug/"
